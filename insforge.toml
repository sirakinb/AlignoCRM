[auth]
allowed_redirect_urls = ["https://crm-app-build-26.vercel.app/dashboard", "http://localhost:8003/dashboard"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
username = "resend"
password = "env(SMTP_PASSWORD)"
sender_email = "noreply@contact.alignocrm.com"
sender_name = "AlignoCRM"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7

[deployments]
subdomain = "alignocrm"
